[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/StelFlow-labs/StelFlow"

[workspace.dependencies]
soroban-sdk = "27.0.6"

# Optimised for on-chain size and determinism. `overflow-checks` stays on in
# release: this contract does i128 money arithmetic and a silent wrap would be a
# value-leakage bug of exactly the kind SECURITY.md ranks first.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
