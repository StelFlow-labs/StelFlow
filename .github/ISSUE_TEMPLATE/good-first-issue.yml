name: Good first issue (maintainers)
description: Scaffold a well-scoped starter task for a new contributor.
title: "good first issue: "
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        **This template is for maintainers creating an issue, not for contributors filing one.**

        If you're a contributor looking for something to work on, browse the existing [`good first issue`](../labels/good%20first%20issue) label instead, and comment on one to claim it.

        A good first issue is one where a competent stranger can tell whether they're done without asking. If you can't fill in the acceptance criteria below, the task isn't scoped yet — scope it before you post it.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Contract (Soroban)
        - TypeScript SDK
        - Indexer
        - Dashboard
        - Docs
        - CI / tooling
    validations:
      required: true

  - type: dropdown
    id: prereq
    attributes:
      label: Skills needed
      multiple: true
      options:
        - Rust
        - Soroban / Stellar familiarity
        - TypeScript
        - React
        - SQL / data modelling
        - Technical writing
        - None beyond general programming
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: Rough size
      description: Honest estimate for someone new to the codebase.
      placeholder: "half a day"
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: The task
      description: What to do, in plain terms.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Background you need
      description: |
        Link the relevant doc section. Explain the *why* briefly — a contributor who understands why the task exists makes better decisions when the instructions run out.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Where to look
      description: Specific file paths. This is the single biggest time-saver you can give someone.
      placeholder: |
        - `contracts/core/src/accrual.rs` — the math this touches
        - `contracts/core/tests/withdraw.rs` — where the test goes
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist the contributor can verify themselves. If it's not checkable without a maintainer's opinion, rewrite it.
      value: |
        - [ ]
        - [ ] Tests cover the new behavior
        - [ ] `cargo fmt` and `cargo clippy -D warnings` pass
        - [ ] Docs updated if behavior changed
    validations:
      required: true

  - type: textarea
    id: outofscope
    attributes:
      label: Out of scope
      description: What *not* to touch. Prevents a two-line fix arriving as a 400-line refactor.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Contributors:** comment below to claim this before you start, and a maintainer will assign it. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). Ask questions in this thread — asking early is not a sign you're struggling, it's how this is supposed to work.
