name: Bug report
description: Something behaves differently than documented.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: StelFlow's contracts are not written yet. If you're reporting that something doesn't work because it doesn't exist, check [ROADMAP.md](../blob/main/ROADMAP.md) first — that's expected, not a bug.

        Bugs in the docs are real bugs. If the architecture doc contradicts itself or states something false about Soroban, file it here.

        **Never file a security vulnerability as a public issue.** See [SECURITY.md](../blob/main/SECURITY.md).

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Contract (Soroban)
        - TypeScript SDK
        - Indexer
        - Dashboard
        - Docs
        - CI / tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behavior. Paste the error, the failing output, or the incorrect text.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: And where that expectation came from — a doc line, a docstring, a test name.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A failing test case is worth more than a description. If you have one, paste it.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Only for code bugs — skip for docs.
      value: |
        - `rustc --version`:
        - `stellar --version`:
        - soroban-sdk version:
        - Node version:
        - Network (testnet / futurenet / local):
        - OS:
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Guesses about the cause are welcome. Say they're guesses.
    validations:
      required: false
