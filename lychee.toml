# Shared config for both docs.yml link-check jobs.
# link-check-internal runs this with --offline, so only the local/anchor-related settings below
# apply to it. link-check-external runs the same config against the live network.

# Verify markdown anchors resolve, not just that the target file exists. This is the setting that
# makes the internal job worth having — StelFlow's docs cross-reference each other by heading
# anchor (e.g. docs/architecture.md#open-questions), and a heading rename silently breaks those
# without this on. Headings with em dashes or emoji (this repo has both — see ROADMAP.md's phase
# headings) produce non-obvious GitHub-style anchors; this is deliberately verified against a
# broken anchor pushed to this PR for the maintainer to watch fail, then removed — see the PR
# description for the run.
include_fragments = true

# Mailto links (SECURITY.md, CODE_OF_CONDUCT.md) aren't checkable without an SMTP probe and
# shouldn't be treated as broken links.
exclude_mail = true

# Give slow-but-legitimate external hosts room before the scheduled external run calls them dead.
timeout = 20
retry_wait_time = 5
max_retries = 2

# GitHub's own API/UI is the most-linked external host in this repo (issue links, security
# advisories) and is also the most likely to 429 an unauthenticated CI runner. Treating 429 as
# "alive" trades a small amount of blindness to an actually-dead github.com link for not crying
# wolf most weeks — the scheduled job already never fails the build (see docs.yml), so this only
# affects whether a given link's line in the report reads "OK" or "rate limited"/red.
accept = [200, 429]
